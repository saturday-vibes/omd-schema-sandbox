omd_service: <service_name> # mandatory - same as service name at root level

omd_component:
  name: <component name> # mandatory -  this is the name of an individual microservice, shared library, or other platform element
  omd_type: <omd_type> # mandatory - must be - microservice, platform, library, sdk, front-end, infra, client-app, dashboard, microservice-serverless, infra-library
  description: <description> # mandatory
  omd_compliance: <compilance> # mandatory - list of allowed values - gdpr, ccpa, sox, none
  omd_cell: <cell> # mandatory - for the time being - omd_cell should match omd_service
  subdivision_strategy: <subdivision strategy> # mandatory if omd_type is infra or microservice with allowed values - global, market, tenant, tenant-market
  supported_markets: #optional - list of allowed values - amer, apac, emea, latam
    - market1
    - market2
  deployment_strategy: <deployment strategy> # mandatory if omd_type is infra or microservice with allowed values - single, primary, all
  omd_sdm_owner_email: <email of WBD SDM/Director that owns the omd_component> # mandatory
  omd_team: <JIRA team name> # mandatory - the name of the team, same as it is in JIRA
  omd_tier: <tier> # mandatory - list of allowed values - undefined, not-applicable, tier-1, tier-2, tier-3, tier-4
  omd_paths: # optional, not needed to be set by all teams
    src:
      - component/src
    infra:
      - infra/component
    docs:
      - docs/component
  dependencies: # optional, links dependencies between different components if any.
    - omd_service: <service1>
      omd_component: <component1>
    - omd_service: <service2>
      omd_component: <component2>

omd_jira_project:
  name: <Jira Project Name> # mandatory
  jira_board: <Link to Jira Board> # mandatory

omd_schema_version: v1.2.0 # mandatory

