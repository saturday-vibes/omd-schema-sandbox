omd_service: <service_name> #same as service name at root level

omd_component:
  name: <component name> # mandatory -  this is the name of an individual microservice, shared library, or other platform element
  omd_type: <type> # must be - microservice, platform, library, sdk, front-end, infra, client-app, dashboard
  description: <description>
  omd_compliance: <compilance> #list of allowed values - gdpr, ccpa, sox, none
  omd_cell: <cell> #For the time being - omd_cell should match omd_service
  subdivision_strategy: <subdivision strategy> #list of allowed value - product, product-market, global, global-market
  omd_sdm_owner_email: <email of WBD SDM/Director that owns the omd_component>
  omd_team: <JIRA team name> #The name of the team, same as it is in JIRA
  omd_paths: #A sub-field of omd_component - this is an optional field, and is not needed to be set by all teams
    src:
      - component/src
    infra:
      - infra/component
    docs:
      - docs/component
      
omd_jira_project:
  name: <Jira Project Name>
  jira_board: <Link to Jira Project>

omd_schema_version: v1.1.1

