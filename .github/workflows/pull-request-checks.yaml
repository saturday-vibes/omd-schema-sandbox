name: pull-request-checks

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pull-request-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    steps:
      - uses: Slashgear/action-check-pr-title@76166c63ec0b25cdbe693e5e972e83ca186313fb # v6.0.0
        with:
          regexp: '^(feat|fix|chore|docs|ci|refactor|test|perf|build|style|revert)(\(.*\))?(!)?:'
          helpMessage: 'PR title must follow conventional commits: type(scope): description. Example: feat(CEA-12345): add new feature'

  release-check:
    name: Release Check
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Get node version
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
      - run: npm ci --ignore-scripts
      - name: Package contents
        run: |
          for dir in component service; do
            (cd "$dir" && npm pack --dry-run)
          done
      # When a file a package ships changed, its version must go above main and the
      # latest tag, and its schema must compile.
      - name: Check what this PR releases
        id: check
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          failed=0
          printf '<!-- check-release -->\n### Schema release check\n\n' > release-check.md
          for kind in component service; do
            pkg="$kind/package.json"
            name=$(jq -r .name "$pkg")
            version=$(jq -r .version "$pkg")
            schema="$kind/$(jq -r .main "$pkg")"
            shipped=()
            while IFS= read -r file; do shipped+=("$kind/$file"); done < <(jq -r '.files[]' "$pkg")

            if git diff --quiet "$BASE" -- "$pkg" "${shipped[@]}"; then
              printf '**%s**: no change\n\n' "$kind" >> release-check.md
              continue
            fi

            errors=()
            previous=$( { git show "$BASE:$pkg" 2>/dev/null | jq -r .version; git tag -l "$kind-v*" | sed "s/^$kind-v//"; } \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              errors+=("version $version must be plain X.Y.Z")
            elif [[ -n "$previous" && ( "$version" == "$previous" || $(printf '%s\n%s\n' "$previous" "$version" | sort -V | tail -1) != "$version" ) ]]; then
              errors+=("files changed: bump the version in $pkg above $previous")
            fi
            if ! output=$(npx --no-install ajv compile -s "$schema" -c ajv-errors --all-errors --strict=false 2>&1); then
              errors+=("$schema does not compile: $(tail -1 <<< "$output")")
            fi

            if [ ${#errors[@]} -eq 0 ]; then
              printf '**%s** %s → %s: on merge, publish `%s@%s` and tag `%s-v%s`\n\n' "$kind" "$previous" "$version" "$name" "$version" "$kind" "$version" >> release-check.md
            else
              failed=1
              printf '**%s** %s → %s: **FAIL**\n' "$kind" "$previous" "$version" >> release-check.md
              printf -- '- %s\n' "${errors[@]}" >> release-check.md
              printf '\n' >> release-check.md
            fi
          done
          cat release-check.md
          cat release-check.md >> "$GITHUB_STEP_SUMMARY"
          echo "exit=$failed" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        if: always() && steps.check.outputs.exit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '[.[] | select(.body | startswith("<!-- check-release -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@release-check.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@release-check.md >/dev/null
          fi
      - name: Fail if the change can't be released
        if: steps.check.outputs.exit != '0'
        run: exit 1
